<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation</title>
<style>
:root{--ink:#1e1b4b;--gold:#c9a24d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#1e1b4b,#4c3d9e);min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink)}
.card{background:#fff;border-radius:28px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 30px 80px #0006}
.hero{padding:36px 28px;background:var(--ink);color:#fff;text-align:center}.hero small{color:var(--gold);letter-spacing:.2em;text-transform:uppercase}
h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:10px 0}.body{padding:24px 28px}.row{margin:8px 0}
.btns{display:flex;gap:10px;margin-top:18px}button{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;cursor:pointer;font-weight:600}
.yes{background:var(--ink);color:#fff}.no{background:#ece9f7;color:var(--ink)}
input,textarea{width:100%;padding:12px;border:1px solid #d8d4ea;border-radius:12px;margin-top:8px;font:inherit}
</style></head><body><div class="card" id="c"><div class="body">Chargement…</div></div>
<script src="config.js"></script><script>
const URL_=CFG.url,KEY=CFG.key;
const t=new URLSearchParams(location.search).get("t"),c=document.getElementById("c");
const rpc=(f,b)=>fetch(`${URL_}/rest/v1/rpc/${f}`,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function load(){
 const i=t&&await rpc("get_invitation",{t});
 if(!i||i.code){c.innerHTML='<div class="body">Invitation introuvable.</div>';return}
 const d=new Date(i.date).toLocaleDateString("fr-FR",{dateStyle:"full",timeZone:"UTC"});
 c.innerHTML=`<div class="hero"><small>Vous êtes invité(e)</small><h1>${esc(i.title)}</h1><div>${esc(d)}</div></div>
 <div class="body"><div class="row"><b>${esc(i.guest)}</b>, nous serions ravis de vous accueillir.</div>
 <div class="row">📍 ${esc(i.location)}</div><div class="row">👔 ${esc(i.dress)}</div><p>${esc(i.message)}</p>
 <input id="n" type="number" min="0" max="10" placeholder="Accompagnants" value="${i.companions}">
 <textarea id="m" placeholder="Un message (régime, allergies…)"></textarea>
 <div class="btns"><button class="yes" onclick="send('YES')">Je viens</button><button class="no" onclick="send('NO')">Je ne peux pas</button></div>
 <div class="row" id="s">${i.status!=="PENDING"?"Réponse actuelle : "+(i.status==="YES"?"présent(e)":"absent(e)"):""}</div>
 <div class="row" style="color:#888">— ${esc(i.host)}</div></div>`}
async function send(s){await rpc("respond_rsvp",{t,s,c:+document.getElementById("n").value||0,n:document.getElementById("m").value});document.getElementById("s").textContent="Merci ! Votre réponse est enregistrée ✔"}
load()
</script></body></html>
